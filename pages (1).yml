      required: true
    - name: caption
      label: Caption (optional)
      type: text
- name: writing
  label: Writing page documents
  type: file
  path: writing.json
  fields:
  - name: documents
    label: Documents
    type: object
    list: true
    fields:
    - name: title
      label: Title
      type: string
      required: true
    - name: description
      label: Short description
      type: text
    - name: category
      label: Category (e.g. Hymn, Chart, Essay)
      type: string
    - name: file
      label: Choose or upload PDF
      type: file
      required: true
      options:
        media: documents
        extensions:
        - pdf
