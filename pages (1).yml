media:
- name: images
  label: Photos
  input: media/images
  output: /media/images
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  rename: safe
- name: documents
  label: PDF documents
  input: files
  output: /files
  extensions:
  - pdf
  rename: safe
content:
- name: photos
  label: Website photos
  type: file
  path: photos.json
  fields:
  - name: home
    label: Home page portrait
    type: object
    fields:
    - name: image
      label: Choose or upload photo
      type: image
      options:
        media: images
    - name: alt
      label: Describe the photo for screen readers
      type: string
      required: true
    - name: caption
      label: Caption (optional)
      type: text
  - name: prayer
    label: Prayer in Song teaching photo
    type: object
    fields:
